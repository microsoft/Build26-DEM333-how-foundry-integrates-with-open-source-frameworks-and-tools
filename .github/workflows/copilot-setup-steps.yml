name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - src/dem333/requirements.txt
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - src/dem333/requirements.txt

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/dem333/requirements.txt

      - name: Install DEM333 dependencies
        run: |
          cd src/dem333
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python sources
        run: |
          cd src/dem333
          python -m compileall -q agents src scripts
